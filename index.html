<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pokemon Damage Calc</title>
<style>
  :root { --bg:#fff; --fg:#1b1b1f; --muted:#6b6b76; --card:#f4f4f7; --line:#d9d9e0; --accent:#d6402f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16161a; --fg:#ececf1; --muted:#9a9aa8; --card:#202027; --line:#34343e; --accent:#ff6b57; }
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:20px; background:var(--bg); color:var(--fg); font:15px/1.45 system-ui, sans-serif; }
  main { max-width:1100px; margin:0 auto; }
  h1 { font-size:1.4rem; margin:0 0 4px; }
  p.sub { color:var(--muted); margin:0 0 16px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:760px) { .grid { grid-template-columns:1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; }
  .card h2 { font-size:1rem; margin:0 0 8px; }
  input, select, textarea, button { font:inherit; background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:5px 8px; }
  input:not([type=checkbox]), select { width:100%; }
  button { cursor:pointer; width:auto; }
  label { display:block; font-size:.78rem; color:var(--muted); }
  label.inline { display:inline-flex; align-items:center; gap:5px; margin-right:12px; font-size:.9rem; color:var(--fg); }
  .frm { display:grid; grid-template-columns:repeat(auto-fit, minmax(140px, 1fr)); gap:8px; margin-bottom:8px; }
  .stats { width:auto; margin:6px 0; }
  .stats input { width:58px; padding:4px; text-align:center; }
  .stats th { font-size:.75rem; color:var(--muted); font-weight:600; padding:2px 4px; border:0; }
  .stats td { border:0; padding:2px 4px; }
  .stats td:first-child { font-size:.75rem; color:var(--muted); }
  .moves { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:8px; }
  details { margin-top:8px; }
  summary { cursor:pointer; color:var(--muted); font-size:.9rem; }
  textarea { width:100%; height:200px; font:12.5px/1.4 ui-monospace, Menlo, monospace; margin:6px 0; resize:vertical; }
  .field { margin:14px 0; }
  table { width:100%; border-collapse:collapse; margin-top:8px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:600; font-size:.8rem; }
  .pct { font-variant-numeric:tabular-nums; white-space:nowrap; font-weight:600; }
  .ko { color:var(--accent); } .none { color:var(--muted); }
  .desc { color:var(--muted); font-size:.78rem; }
  .err { color:var(--accent); font-size:.85rem; }
  .scroll { overflow-x:auto; }
</style>
</head>
<body>
<main>
  <h1>Pokemon Damage Calc</h1>
  <p class="sub">Build sets with the form, or open "Showdown paste" on either side to import or export. Powered by <a href="https://github.com/smogon/damage-calc" style="color:inherit">@smogon/calc</a>.</p>

  <div class="card field">
    <label class="inline">Gen <select id="gen" style="width:auto"></select></label>
    <label class="inline"><input type="checkbox" id="doubles"> Doubles</label>
    <label class="inline"><input type="checkbox" id="crit"> Crits</label>
    <label class="inline">Weather
      <select id="weather" style="width:auto"><option value="">None</option><option>Sun</option><option>Rain</option><option>Sand</option><option>Snow</option><option>Hail</option><option>Harsh Sunshine</option><option>Heavy Rain</option></select>
    </label>
    <label class="inline">Terrain
      <select id="terrain" style="width:auto"><option value="">None</option><option>Electric</option><option>Grassy</option><option>Misty</option><option>Psychic</option></select>
    </label>
  </div>

  <div class="grid">
    <section class="card" id="sideA"></section>
    <section class="card" id="sideB"></section>
  </div>
  <div id="out"></div>

  <datalist id="dl-species"></datalist><datalist id="dl-items"></datalist>
  <datalist id="dl-abilities"></datalist><datalist id="dl-moves"></datalist>
</main>

<script type="module">
let calc;
try {
  const ns = await import('https://cdn.jsdelivr.net/npm/@smogon/calc@0.10.0/+esm');
  calc = ns.Generations ? ns : ns.default;
} catch (e) {
  console.error('Failed to load @smogon/calc', e);
}

const SAMPLE_A = `Flutter Mane @ Choice Specs
Ability: Protosynthesis
Level: 50
Tera Type: Fairy
EVs: 4 HP / 252 SpA / 252 Spe
Timid Nature
IVs: 0 Atk
- Moonblast
- Shadow Ball
- Dazzling Gleam
- Protect`;
const SAMPLE_B = `Incineroar @ Safety Goggles
Ability: Intimidate
Level: 50
Tera Type: Grass
EVs: 252 HP / 4 Atk / 4 Def / 244 SpD / 4 Spe
Careful Nature
- Fake Out
- Flare Blitz
- Knock Off
- Parting Shot`;

const $ = id => document.getElementById(id);
const STATS = ['hp', 'atk', 'def', 'spa', 'spd', 'spe'];
const STAT_LABELS = ['HP', 'Atk', 'Def', 'SpA', 'SpD', 'Spe'];
const NATURES = ['Hardy','Lonely','Brave','Adamant','Naughty','Bold','Docile','Relaxed','Impish','Lax','Timid','Hasty','Serious','Jolly','Naive','Modest','Mild','Quiet','Bashful','Rash','Calm','Gentle','Sassy','Careful','Quirky'];
const TYPES = ['Normal','Fire','Water','Electric','Grass','Ice','Fighting','Poison','Ground','Flying','Psychic','Bug','Rock','Ghost','Dragon','Dark','Steel','Fairy'];

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

// ---------- Showdown paste parser / exporter ----------
function parseStats(str) {
  const out = {};
  str.split('/').forEach(part => {
    const m = part.trim().match(/^(\d+)\s*(\w+)$/);
    if (m && STATS.includes(m[2].toLowerCase())) out[m[2].toLowerCase()] = parseInt(m[1], 10);
  });
  return out;
}

function parseSet(block) {
  const lines = block.split('\n').map(l => l.trim()).filter(Boolean);
  if (!lines.length) return null;
  const s = { moves: [], evs: {}, ivs: {} };
  let head = lines[0];
  const at = head.split(' @ ');
  head = at[0].trim();
  if (at[1]) s.item = at[1].trim();
  head = head.replace(/\s*\((M|F)\)\s*$/, '');
  const m = head.match(/^(.*)\((.+)\)\s*$/);
  s.species = (m ? m[2] : head).trim();
  for (const line of lines.slice(1)) {
    let r;
    if (line.startsWith('-')) s.moves.push(line.replace(/^-\s*/, '').split('/')[0].trim());
    else if ((r = line.match(/^Ability:\s*(.+)$/i))) s.ability = r[1].trim();
    else if ((r = line.match(/^Level:\s*(\d+)/i))) s.level = parseInt(r[1], 10);
    else if ((r = line.match(/^Tera Type:\s*(.+)$/i))) s.tera = r[1].trim();
    else if ((r = line.match(/^EVs:\s*(.+)$/i))) s.evs = parseStats(r[1]);
    else if ((r = line.match(/^IVs:\s*(.+)$/i))) s.ivs = parseStats(r[1]);
    else if ((r = line.match(/^(\w+)\s+Nature$/i))) s.nature = r[1];
  }
  return s;
}

function parseTeam(text) {
  return text.replace(/\r/g, '').split(/\n\s*\n/).map(b => b.trim()).filter(Boolean).map(parseSet).filter(Boolean);
}

function exportSet(s) {
  const L = [s.species + (s.item ? ' @ ' + s.item : '')];
  if (s.ability) L.push('Ability: ' + s.ability);
  if (s.level && s.level !== 100) L.push('Level: ' + s.level);
  if (s.tera) L.push('Tera Type: ' + s.tera);
  const evs = STATS.filter(k => s.evs[k]).map(k => s.evs[k] + ' ' + STAT_LABELS[STATS.indexOf(k)]);
  if (evs.length) L.push('EVs: ' + evs.join(' / '));
  if (s.nature) L.push(s.nature + ' Nature');
  const ivs = STATS.filter(k => s.ivs[k] !== 31).map(k => s.ivs[k] + ' ' + STAT_LABELS[STATS.indexOf(k)]);
  if (ivs.length) L.push('IVs: ' + ivs.join(' / '));
  s.moves.forEach(m => L.push('- ' + m));
  return L.join('\n');
}

// ---------- Set builder UI ----------
function makeSide(root, title, sample) {
  const statHead = STAT_LABELS.map(l => `<th>${l}</th>`).join('');
  const evRow = STATS.map(k => `<td><input type="number" min="0" max="252" step="4" value="0" data-ev="${k}"></td>`).join('');
  const ivRow = STATS.map(k => `<td><input type="number" min="0" max="31" value="31" data-iv="${k}"></td>`).join('');
  root.innerHTML = `
    <h2>${title}</h2>
    <div class="frm" data-team-wrap style="display:none"><label>Imported team<select data-f="team"></select></label></div>
    <div class="frm">
      <label>Pokemon<input list="dl-species" data-f="species"></label>
      <label>Item<input list="dl-items" data-f="item"></label>
      <label>Ability<input list="dl-abilities" data-f="ability"></label>
      <label>Nature<select data-f="nature">${NATURES.map(n => `<option>${n}</option>`).join('')}</select></label>
      <label>Level<input type="number" min="1" max="100" value="100" data-f="level"></label>
      <label>Tera type<select data-f="tera"><option value="">None</option>${TYPES.map(t => `<option>${t}</option>`).join('')}</select></label>
    </div>
    <label class="inline"><input type="checkbox" data-f="isTera"> Terastallized</label>
    <table class="stats"><tr><th></th>${statHead}</tr>
      <tr><td>EVs</td>${evRow}</tr><tr><td>IVs</td>${ivRow}</tr></table>
    <div class="moves">${[0,1,2,3].map(i => `<input list="dl-moves" placeholder="Move ${i + 1}" data-mv="${i}">`).join('')}</div>
    <details><summary>Showdown paste</summary>
      <textarea data-f="paste" spellcheck="false" placeholder="Paste Showdown sets here"></textarea>
      <button type="button" data-act="import">Import paste</button>
      <button type="button" data-act="export">Export current set</button>
    </details>`;
  const q = s => root.querySelector(s);
  const f = n => q(`[data-f="${n}"]`);
  let team = [];

  function load(s) {
    f('species').value = s.species || '';
    f('item').value = s.item || '';
    f('ability').value = s.ability || '';
    f('nature').value = s.nature ? s.nature[0].toUpperCase() + s.nature.slice(1).toLowerCase() : 'Hardy';
    f('level').value = s.level || 100;
    f('tera').value = s.tera || '';
    STATS.forEach(k => {
      q(`[data-ev="${k}"]`).value = (s.evs && s.evs[k]) || 0;
      q(`[data-iv="${k}"]`).value = s.ivs && s.ivs[k] !== undefined ? s.ivs[k] : 31;
    });
    [0, 1, 2, 3].forEach(i => { q(`[data-mv="${i}"]`).value = (s.moves && s.moves[i]) || ''; });
  }

  function read() {
    const num = (e, d) => { const v = parseInt(e.value, 10); return isNaN(v) ? d : v; };
    const s = {
      species: f('species').value.trim(),
      item: f('item').value.trim() || undefined,
      ability: f('ability').value.trim() || undefined,
      nature: f('nature').value,
      level: num(f('level'), 100),
      tera: f('tera').value,
      isTera: f('isTera').checked,
      evs: {}, ivs: {},
      moves: [0, 1, 2, 3].map(i => q(`[data-mv="${i}"]`).value.trim()).filter(Boolean),
    };
    STATS.forEach(k => {
      s.evs[k] = num(q(`[data-ev="${k}"]`), 0);
      s.ivs[k] = num(q(`[data-iv="${k}"]`), 31);
    });
    return s;
  }

  root.addEventListener('click', e => {
    const act = e.target.dataset.act;
    if (act === 'import') {
      team = parseTeam(f('paste').value);
      const sel = f('team');
      sel.innerHTML = '';
      team.forEach((s, i) => { const o = el('option', '', s.species + (s.item ? ' @ ' + s.item : '')); o.value = i; sel.appendChild(o); });
      q('[data-team-wrap]').style.display = team.length > 1 ? '' : 'none';
      if (team.length) load(team[0]);
      update();
    } else if (act === 'export') {
      f('paste').value = exportSet(read());
    }
  });
  f('team').addEventListener('change', e => { load(team[e.target.value]); update(); });
  load(parseSet(sample));
  return { read };
}

// ---------- Calc ----------
function buildPokemon(gen, s) {
  const o = { level: s.level, item: s.item, ability: s.ability, nature: s.nature, evs: s.evs, ivs: s.ivs };
  if (s.isTera && s.tera) o.teraType = s.tera;
  return new calc.Pokemon(gen, s.species, o);
}

function runSide(gen, aSet, dSet, field, crit) {
  const atk = buildPokemon(gen, aSet), def = buildPokemon(gen, dSet);
  const hp = def.maxHP();
  return aSet.moves.map(name => {
    try {
      const res = calc.calculate(gen, atk, def, new calc.Move(gen, name, { isCrit: crit }), field);
      const [lo, hi] = res.range();
      if (!hi) return { name, none: true };
      let ko = '';
      try { ko = res.kochance().text; } catch (e) {}
      return { name, pct: (lo / hp * 100).toFixed(1) + ' - ' + (hi / hp * 100).toFixed(1) + '%', hp: lo + ' - ' + hi + ' / ' + hp, ko, desc: res.desc() };
    } catch (e) {
      return { name, error: e.message };
    }
  });
}

function renderTable(title, rows) {
  const card = el('section', 'card');
  card.style.marginTop = '14px';
  card.appendChild(el('h2', '', title));
  const wrap = el('div', 'scroll'), t = el('table'), head = el('tr');
  ['Move', 'Damage', 'HP', 'KO chance'].forEach(h => head.appendChild(el('th', '', h)));
  t.appendChild(head);
  if (!rows.length) { const tr = el('tr'), td = el('td', 'none', 'No moves entered.'); td.colSpan = 4; tr.appendChild(td); t.appendChild(tr); }
  rows.forEach(r => {
    const tr = el('tr'), first = el('td', '', r.name);
    if (r.desc) first.appendChild(el('div', 'desc', r.desc));
    tr.appendChild(first);
    if (r.error) { const td = el('td', 'err', r.error); td.colSpan = 3; tr.appendChild(td); }
    else if (r.none) { const td = el('td', 'none', 'No damage'); td.colSpan = 3; tr.appendChild(td); }
    else { tr.appendChild(el('td', 'pct', r.pct)); tr.appendChild(el('td', 'none', r.hp)); tr.appendChild(el('td', 'ko', r.ko)); }
    t.appendChild(tr);
  });
  wrap.appendChild(t); card.appendChild(wrap);
  return card;
}

function fillLists(gen) {
  const set = (id, iter) => {
    try { $(id).innerHTML = Array.from(iter, x => `<option value="${x.name.replace(/"/g, '&quot;')}">`).join(''); } catch (e) {}
  };
  set('dl-species', gen.species); set('dl-items', gen.items);
  set('dl-abilities', gen.abilities); set('dl-moves', gen.moves);
}

let sides = [];
function update() {
  const out = $('out');
  out.innerHTML = '';
  if (typeof calc === 'undefined') { out.appendChild(el('p', 'err', 'Could not load @smogon/calc. Check your internet connection.')); return; }
  const a = sides[0].read(), b = sides[1].read();
  if (!a.species || !b.species) { out.appendChild(el('p', 'none', 'Enter a Pokemon on each side.')); return; }
  try {
    const gen = calc.Generations.get(parseInt($('gen').value, 10));
    const field = new calc.Field({
      gameType: $('doubles').checked ? 'Doubles' : 'Singles',
      weather: $('weather').value || undefined,
      terrain: $('terrain').value || undefined,
    });
    const crit = $('crit').checked;
    out.appendChild(renderTable(a.species + ' attacking ' + b.species, runSide(gen, a, b, field, crit)));
    out.appendChild(renderTable(b.species + ' attacking ' + a.species, runSide(gen, b, a, field, crit)));
  } catch (e) {
    out.appendChild(el('p', 'err', 'Error: ' + e.message));
  }
}

for (let g = 9; g >= 1; g--) { const o = el('option', '', String(g)); o.value = g; $('gen').appendChild(o); }
sides = [makeSide($('sideA'), 'Side A', SAMPLE_A), makeSide($('sideB'), 'Side B', SAMPLE_B)];
if (typeof calc !== 'undefined') fillLists(calc.Generations.get(9));
$('gen').addEventListener('change', () => { fillLists(calc.Generations.get(parseInt($('gen').value, 10))); update(); });
document.addEventListener('input', e => { if (e.target.dataset.f !== 'paste') update(); });
document.addEventListener('change', update);
update();
</script>
</body>
</html>
